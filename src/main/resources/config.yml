# ─────────────────────────────────────────────────────────────
#  GrimConfig — toggle individual GrimAC checks on or off.
#
#  true  = check is ENABLED  (Grim flags/alerts/punishes normally)
#  false = check is DISABLED (flags, setbacks and punishment
#          commands for it are suppressed)
#
#  You can edit this file and run /grimconfig reload, or simply
#  use /grimconfig in-game for a clickable GUI.
#
#  This list is AUTO-POPULATED: any check GrimAC actually loads
#  is added here automatically (defaulting to true) the first
#  time a player joins. Entries below that don't match a real
#  check on your Grim version are harmless and simply ignored.
# ─────────────────────────────────────────────────────────────
checks:
  AimDuplicateLook: true
  AimInvalidPitch: true
  AimInvalidYaw: true
  AimModulo360: true
